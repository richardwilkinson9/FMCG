name: Mutation testing

# Stryker over src/utils/calculations.ts — the maths is the product, so a
# mutant that survives the suite means a missing test. Heavier than the unit
# run (~1-2 min), so it runs nightly and on demand rather than blocking every
# PR. The score is enforced by stryker.config.json's thresholds.

on:
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC
  workflow_dispatch:

jobs:
  mutation:
    name: Stryker mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14
