name: CI

# The pipeline the excellence sprint asked for: typecheck -> unit/property/
# fuzz -> build + prerender guards -> e2e matrix (Chromium/Firefox/WebKit +
# iPhone SE) -> axe -> visual -> Lighthouse + bundle budget. Every job runs on
# every PR into the deploy branch; main stays deployable. Mutation testing is
# heavier and runs nightly (and on demand) rather than blocking each PR.

on:
  pull_request:
    branches: [claude/fmcg-maths-mvp-f72yht]
  push:
    branches: [claude/fmcg-maths-mvp-f72yht]
  workflow_dispatch:

# A new push to a branch cancels the previous run for that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The e2e config adds Firefox/WebKit projects only when this is set; the
  # Playwright container ships every browser, so CI runs the full matrix.
  PW_WEBKIT: '1'
  PLAYWRIGHT_VERSION: v1.61.1

jobs:
  # ── Fast feedback: lint, types, the whole vitest suite ──────────────────────
  verify:
    name: Lint · typecheck · unit/property/fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # ── Build once, guard the prerender, budget the bytes, share dist ───────────
  build:
    name: Build · prerender guards · SEO · budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit:seo
      - run: npm run audit:budget
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # ── The cross-browser matrix, in the pinned Playwright container ────────────
  e2e:
    name: e2e (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    # GitHub sets HOME=/github/home (uid 1001) in containers, but Firefox
    # refuses to launch unless $HOME is owned by the running user (root here).
    # /root is root-owned, so this makes every engine start.
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, iphone-se, iphone-se-webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 7

  # ── Accessibility gate (axe over every route, two viewports) ────────────────
  a11y:
    name: axe accessibility gate
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:a11y

  # ── Visual regression (receipts at two widths) — container gives font parity ─
  #
  # ADVISORY until the baselines are regenerated in THIS container. The PNGs in
  # the repo were generated by the sandbox's Chromium, which rasterises fonts
  # differently from this image, so a first run here reports cross-environment
  # diffs, not real brand drift. To make this job blocking: run once in this
  # image with `--update-snapshots`, commit the regenerated
  # e2e-visual/**-snapshots, then delete the `continue-on-error` line below.
  # From then on any real receipt-pixel drift fails the build. The upload always
  # runs so the diffs are inspectable.
  visual:
    name: visual regression (advisory — see workflow comment)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: npm run test:e2e:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots-and-diffs
          path: |
            test-results
            e2e-visual
          retention-days: 7

  # ── Lighthouse: category scores per route against lighthouserc.json ─────────
  lighthouse:
    name: Lighthouse budget
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # lhci's chrome-launcher can't find Chrome in the container by name, so
      # point CHROME_PATH at Playwright's bundled Chromium; --no-sandbox is set
      # in lighthouserc.json because Lighthouse runs as root here.
      - run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          echo "CHROME_PATH=$CHROME_PATH"
          npx --yes @lhci/cli@0.14.x autorun
